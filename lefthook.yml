pre-commit:
  commands:
    rubocop:
      root: "backend/"
      glob: "**/*.{rb,rake}"
      run: "bundle exec rubocop -A --force-exclusion {staged_files}"
      stage_fixed: true

    erb-formatter:
      root: "backend/"
      glob: "**/*.html.erb"
      run: "bundle exec erb-formatter --write {staged_files}"
      stage_fixed: true

    erblint:
      root: "backend/"
      glob: "**/*.erb"
      run: "bundle exec erb_lint --autocorrect {staged_files}"
      stage_fixed: true

    theme:
      glob: "theme.toml"
      run: "(cd backend && bundle exec rake theme:generate) && git add backend/app/assets/tailwind/theme.css android/app/src/main/res/values/colors.xml ios/App/Resources/Assets.xcassets/Colors ios/App/Resources/Assets.xcassets/AccentColor.colorset"
