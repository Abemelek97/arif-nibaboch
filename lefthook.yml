pre-commit:
  commands:
    rubocop:
      root: "backend/"
      glob: "**/*.{rb,rake}"
      run: "bundle exec rubocop -A --force-exclusion {staged_files}"
      stage_fixed: true

    erb-formatter:
      root: "backend/"
      glob: "**/*.html.erb"
      run: "bundle exec erb-formatter --write {staged_files}"
      stage_fixed: true

    erblint:
      root: "backend/"
      glob: "**/*.erb"
      run: "bundle exec erb_lint --autocorrect {staged_files}"
      stage_fixed: true
